[project]
name = "study-geoai"
version = "0.1.0"
description = "Study environment for classical ML and optimisation in GeoAI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    # Versions before 1.5.5 have bugs; see docs/datasets/z-yuiseki-static/README.md.
    "duckdb>=1.5.5",
    # Must match the HiGHS bundled in ortools (same soname libhighs.so.1).
    # ortools 9.15 ships HiGHS 1.12.0; bump both together.
    "highspy>=1.12,<1.13",
    "lightgbm>=4.7.0",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "ortools>=9.15.6755,<9.16",
    "rasterio>=1.5.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.52.0",
    "statsmodels>=0.15.0",
    "verde>=1.9.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_geoai"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: reads remote data sources (deselect with -m 'not network')"]
filterwarnings = [
    # shap itself calls matplotlib's pending-deprecated Colormap.set_bad/over/under.
    "ignore::PendingDeprecationWarning:shap.plots.colors._colors",
]
